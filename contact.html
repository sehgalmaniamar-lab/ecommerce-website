<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LootLo | Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./contact.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">LootLo</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="offer.html">Offers</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="icons">
      <p id="no"></p>
      <a href="#"><img src="./images/cart-shopping-solid-full.svg" alt="Cart"></a>
    </div>
  </header>

  <section class="contact-area">
    <div class="contact-wrap">

      <div class="contact-info">
        <h1>Get in touch</h1>
        <p>Questions, feedback, or partnership ideas? Drop a message.</p>
        <p><strong>Email:</strong> support@lootlo.example</p>
        <p><strong>Phone:</strong> +91 98765 43210</p>
      </div>

      <form class="contact-form" action="#" onsubmit="return false;">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Your email" required>

        <label for="message">Message</label>
        <textarea id="message" rows="6" placeholder="Write your message..." required></textarea>

        <button class="btn" type="submit">Send Message</button>
      </form>

    </div>
  </section>

  <footer>
    <p>&copy; 2025 LootLo. All Rights Reserved.</p>
  </footer>
  <script src="index.js"></script>
</body>
</html>
